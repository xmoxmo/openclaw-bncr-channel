name: Publish to npm (OIDC trusted publishing)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # needed for npm provenance / OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install deps
        run: npm ci

      - name: Full check
        run: npm run fullcheck

      - name: Check release version policy
        run: npm run selfcheck:release

      - name: Build
        run: npm run build

      - name: Verify committed dist
        run: git diff --exit-code -- dist/index.js

      - name: Verify package
        run: npm pack --dry-run

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance --access public
