name: Publish to npm (OIDC trusted publishing)

# 职责边界（2026-09-29 定调）：
#   本地工作仓 plugins/bncr   → 开发 + fullcheck + build + 提交（门禁在这里）
#   本地发布仓 exports/bncr-public → 同步后复检 fullcheck / build / dist 一致性 / pack
#   远端 CI（本文件）         → 只把「已检查完毕的代码」发出去，不跑任何检查
# 因此本 workflow 只保留 checkout + setup-node + npm publish。
# dist/index.js 已在本地验证并与源码一致后提交入库，远端不再重建。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # needed for npm provenance / OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance --access public
